name: Remove obsolete release history instruction

on:
  push:
    branches:
      - chore/remove-obsolete-release-history

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-obsolete-release-history
      - name: Remove obsolete sections
        shell: python
        run: |
          from pathlib import Path

          marker = "\n\n## Release bijwerkacties\n"
          for filename in ("AGENTS.md", "CLAUDE.md"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  raise SystemExit(f"Marker ontbreekt in {filename}")
              updated = text.split(marker, 1)[0].rstrip() + "\n"
              path.write_text(updated, encoding="utf-8")

          Path(".github/workflows/remove-obsolete-release-history.yml").unlink()
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md CLAUDE.md .github/workflows/remove-obsolete-release-history.yml
          git commit -m "Verwijder verouderde release-instructie"
          git push origin HEAD:chore/remove-obsolete-release-history
