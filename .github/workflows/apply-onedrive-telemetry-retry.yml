name: Apply OneDrive telemetry retry fix

on:
  push:
    branches:
      - fix/onedrive-telemetry-retry

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onedrive-telemetry-retry
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply changes
        run: python .github/scripts/apply-onedrive-telemetry-retry.py

      - name: Validate diff
        run: |
          git diff --check
          ! grep -R "ValidateUserStorageAccess\|AssertUserStorageDirectoryWritable\|AssertUserStorageFileWritable" DocBot.ahk
          grep -F 'attrib -U +P' DocBot.ahk
          grep -F 'TelemetryPendingInstallationId' Telemetry.ahk
          grep -F 'Telemetry_ScheduleInstallationIdRetry' Telemetry.ahk

      - name: Commit final branch state
        run: |
          rm .github/scripts/apply-onedrive-telemetry-retry.py
          rm .github/workflows/apply-onedrive-telemetry-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Behandel tijdelijke OneDrive-opslag bij telemetrie"
          git push origin HEAD:fix/onedrive-telemetry-retry
