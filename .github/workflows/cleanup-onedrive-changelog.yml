name: Clean up obsolete storage changelog

on:
  push:
    branches:
      - fix/onedrive-telemetry-retry

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onedrive-telemetry-retry

      - name: Remove obsolete changelog entry
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8-sig")
          obsolete = '''- DocBot controleert direct na het voorbereiden van de gebruikersmap of de map
            en bestaande beheerde gegevensbestanden schrijfbaar zijn. Bij een probleem
            toont DocBot het betreffende pad en stopt de opstart, zodat instellingen en
            gebruikersgegevens niet onbetrouwbaar worden verwerkt. Een nieuw telemetrie-
            installatie-ID wordt bovendien pas gebruikt nadat het blijvend in
            `settings.ini` is opgeslagen; bij een schrijffout wordt geen tijdelijk ID
            verzonden.
          '''
          if text.count(obsolete) != 1:
              raise RuntimeError("Verouderde opslagbullet niet exact eenmaal gevonden")
          text = text.replace(obsolete, "", 1)
          path.write_text(text, encoding="utf-8")

      - name: Validate documentation
        run: |
          git diff --check
          ! grep -F 'DocBot controleert direct na het voorbereiden van de gebruikersmap' README.md
          grep -F 'DocBot voert bij het opstarten geen algemene schrijfbaarheidstest meer uit' README.md
          grep -F 'global AppVersion := "2.2-dev.5"' DocBot.ahk
          git diff --exit-code -- DocBot.ahk

      - name: Commit documentation correction
        run: |
          rm .github/workflows/cleanup-onedrive-changelog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/cleanup-onedrive-changelog.yml
          git commit -m "Verwijder verouderde opslagmelding uit changelog"
          git push origin HEAD:fix/onedrive-telemetry-retry
