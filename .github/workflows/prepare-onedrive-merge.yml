name: Prepare OneDrive fix for develop

on:
  push:
    branches:
      - fix/onedrive-telemetry-retry

permissions:
  contents: write

jobs:
  prepare-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onedrive-telemetry-retry
          fetch-depth: 0

      - name: Update develop version and documentation
        shell: python
        run: |
          from pathlib import Path

          docbot_path = Path("DocBot.ahk")
          docbot = docbot_path.read_text(encoding="utf-8-sig")
          old_version = 'global AppVersion := "2.2-onedrive-telemetry-fix.0"'
          new_version = 'global AppVersion := "2.2-dev.5"'
          if docbot.count(old_version) != 1:
              raise RuntimeError("Verwachte branchversie niet exact eenmaal gevonden")
          docbot = docbot.replace(old_version, new_version, 1)
          docbot_path.write_text(docbot, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8-sig")

          old_changelog = '''- De gebruikersmap wordt waar mogelijk met `attrib -U +P` als altijd lokaal
            beschikbaar gemarkeerd, zonder dat een mislukte pinactie de start blokkeert.
          - DocBot voert bij het opstarten geen algemene schrijfbaarheidstest meer uit;
            iedere echte schrijfactie houdt zijn eigen gerichte foutafhandeling.
          - Een ontbrekend telemetrie-installatie-ID wordt pas gebruikt nadat permanente
            opslag is bevestigd. Bij tijdelijke onbeschikbaarheid volgen vijf pogingen
            binnen de eerste minuten en daarna ieder uur een nieuwe poging.
          '''
          new_changelog = '''- De gebruikersmap wordt waar mogelijk met `attrib -U +P` als altijd lokaal
            beschikbaar gemarkeerd, zonder dat een mislukte pinactie de start blokkeert.
          - DocBot voert bij het opstarten geen algemene schrijfbaarheidstest meer uit;
            iedere echte schrijfactie houdt zijn eigen gerichte foutafhandeling.
          - Een bestaand telemetrie-installatie-ID wordt alleen gelezen en direct gebruikt.
            Alleen een ontbrekend nieuw ID wordt geschreven en pas na bevestigde opslag
            actief. Bij tijdelijke onbeschikbaarheid volgen vijf pogingen binnen de eerste
            minuten en daarna ieder uur een nieuwe poging.
          '''
          if readme.count(old_changelog) != 1:
              raise RuntimeError("Verwacht OneDrive-changelogblok niet exact eenmaal gevonden")
          readme = readme.replace(old_changelog, new_changelog, 1)

          telemetry_anchor = '''Als telemetrie lokaal is ingeschakeld, stuurt DocBot een statusbericht naar
          een Power Automate Teams-webhook. De webhook-URL staat uitsluitend in het
          niet door Git gevolgde `DocBot.local.ahk`. De eerste heartbeat wordt tien
          seconden na het starten verzonden en daarna iedere vijftien minuten.
          '''
          telemetry_replacement = telemetry_anchor + '''
          Bij het starten leest DocBot eerst het bestaande installatie-ID uit
          `settings.ini`. Als dat ID beschikbaar is, wordt niets teruggeschreven en kan
          telemetrie direct starten. Alleen wanneer het ID ontbreekt, maakt DocBot een
          nieuw ID aan. Dat nieuwe ID wordt pas gebruikt nadat schrijven en teruglezen
          zijn gelukt. Bij een tijdelijk niet-beschikbare OneDrive-map probeert DocBot
          dit in totaal vijf keer tijdens de eerste minuten en daarna ieder uur opnieuw;
          de overige functies van DocBot blijven intussen beschikbaar.
          '''
          if readme.count(telemetry_anchor) != 1:
              raise RuntimeError("Telemetrie-inleidingsblok niet exact eenmaal gevonden")
          readme = readme.replace(telemetry_anchor, telemetry_replacement, 1)
          readme_path.write_text(readme, encoding="utf-8")

          assert 'global AppVersion := "2.2-dev.5"' in docbot
          assert "Een bestaand telemetrie-installatie-ID wordt alleen gelezen" in readme
          assert "Als dat ID beschikbaar is, wordt niets teruggeschreven" in readme

      - name: Validate integration state
        run: |
          git diff --check
          grep -F 'global AppVersion := "2.2-dev.5"' DocBot.ahk
          grep -F 'Als dat ID beschikbaar is, wordt niets teruggeschreven' README.md
          grep -F 'vijf keer tijdens de eerste minuten en daarna ieder uur opnieuw' README.md
          ! grep -F 'global AppVersion := "2.2-onedrive-telemetry-fix.0"' DocBot.ahk

      - name: Commit integration preparation
        run: |
          rm .github/workflows/prepare-onedrive-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DocBot.ahk README.md .github/workflows/prepare-onedrive-merge.yml
          git commit -m "Bereid OneDrive-fix voor op develop"
          git push origin HEAD:fix/onedrive-telemetry-retry
