name: Apply storage location check refactor

on:
  push:
    branches:
      - StorageLocCheck-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: StorageLocCheck-fix
          fetch-depth: 0

      - name: Move generic storage validation to DocBot
        run: |
          python - <<'PY'
          from pathlib import Path

          telemetry_path = Path("Telemetry.ahk")
          telemetry = telemetry_path.read_text(encoding="utf-8")

          telemetry_init_block = '''
    try {
        Telemetry_ValidateStorageAccess(TelemetryConfigFile)
    } catch as storageError {
        MsgBox(
            "DocBot kan de gebruikersgegevens niet betrouwbaar opslaan.`n`n"
            . storageError.Message
            . "`n`nControleer de rechten, synchronisatie of beveiliging van "
            . "de genoemde locatie en start DocBot daarna opnieuw.",
            "DocBot - Opslagfout",
            "Icon!"
        )
        ExitApp()
    }
'''
          if telemetry_init_block not in telemetry:
              raise SystemExit("Telemetry storage validation call block not found")
          telemetry = telemetry.replace(telemetry_init_block, "", 1)

          storage_section_marker = '''
; =============================================================================
; Opslagcontrole
; =============================================================================
'''
          marker_index = telemetry.find(storage_section_marker)
          if marker_index < 0:
              raise SystemExit("Telemetry storage validation section not found")
          telemetry = telemetry[:marker_index].rstrip() + "\n"
          telemetry_path.write_text(telemetry, encoding="utf-8", newline="\n")

          docbot_path = Path("DocBot.ahk")
          docbot = docbot_path.read_text(encoding="utf-8")

          startup_old = '''InitializeUserStorage()
InitializeBundledPackages()
'''
          startup_new = '''InitializeUserStorage()
try ValidateStorageAccess()
catch as storageError {
    MsgBox(
        "DocBot kan de gebruikersgegevens niet betrouwbaar opslaan.`n`n"
        . storageError.Message
        . "`n`nControleer de rechten, synchronisatie of beveiliging van "
        . "de genoemde locatie en start DocBot daarna opnieuw.",
        "DocBot - Opslagfout",
        "Icon!"
    )
    ExitApp()
}
InitializeBundledPackages()
'''
          if startup_old not in docbot:
              raise SystemExit("DocBot startup insertion point not found")
          docbot = docbot.replace(startup_old, startup_new, 1)

          generic_storage_functions = r'''

; Controleer vroeg in de opstart dat de gedeelde gebruikersopslag bruikbaar is.
; De map en ieder bestaand beheerd gegevensbestand worden afzonderlijk getest;
; de daadwerkelijke schrijffuncties behouden daarnaast hun eigen foutafhandeling.
ValidateStorageAccess() {
    global UserDataDir, ConfigFile, DefaultHotstringFile
    global DefaultPackageSettingsFile, DefaultSpeedDialFile

    if !DirExist(UserDataDir)
        throw Error("De gebruikersmap bestaat niet.`n`n" UserDataDir)

    AssertDirectoryWritable(UserDataDir)

    managedFiles := [
        ConfigFile,
        DefaultHotstringFile,
        DefaultPackageSettingsFile,
        DefaultSpeedDialFile
    ]

    for _, path in managedFiles {
        if FileExist(path)
            AssertFileWritable(path)
    }
}

AssertDirectoryWritable(directory) {
    probePath := directory
        . "\.docbot-write-test-"
        . A_NowUTC
        . "-"
        . A_TickCount
        . "-"
        . Random(100000, 999999)
        . ".tmp"
    probeFile := 0

    try {
        probeFile := FileOpen(probePath, "w", "UTF-8-RAW")
        if !IsObject(probeFile)
            throw Error("Het tijdelijke testbestand kon niet worden geopend.")

        probeFile.Write("DocBot schrijftest")
        probeFile.Close()
        probeFile := 0
        FileDelete(probePath)
    } catch as error {
        if IsObject(probeFile)
            try probeFile.Close()
        if FileExist(probePath)
            try FileDelete(probePath)

        throw Error(
            "DocBot kan niet schrijven in de gebruikersmap.`n`n"
            . directory
            . "`n`n"
            . error.Message
        )
    }
}

AssertFileWritable(path) {
    file := 0

    try {
        attributes := FileGetAttrib(path)

        if InStr(attributes, "D")
            throw Error("DocBot verwachtte een bestand, maar vond een map.`n`n" path)

        if InStr(attributes, "R")
            throw Error("Dit DocBot-bestand is alleen-lezen.`n`n" path)

        file := FileOpen(path, "rw")
        if !IsObject(file)
            throw Error("Het bestand kon niet voor lezen en schrijven worden geopend.`n`n" path)

        file.Close()
        file := 0
    } catch as error {
        if IsObject(file)
            try file.Close()

        if InStr(error.Message, path)
            throw error

        throw Error(
            "DocBot kan dit bestand niet wijzigen.`n`n"
            . path
            . "`n`n"
            . error.Message
        )
    }
}
'''
          insertion_marker = "\nRebaseCopiedHotstringPath(sourceDir) {"
          if insertion_marker not in docbot:
              raise SystemExit("DocBot storage function insertion point not found")
          docbot = docbot.replace(
              insertion_marker,
              generic_storage_functions + insertion_marker,
              1,
          )
          docbot_path.write_text(docbot, encoding="utf-8", newline="\n")
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-storage-location-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DocBot.ahk Telemetry.ahk .github/workflows/apply-storage-location-check.yml
          git commit -m "Verplaats opslagcontrole naar DocBot"
          git push origin StorageLocCheck-fix
