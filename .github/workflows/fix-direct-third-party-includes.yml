name: Fix direct third-party includes

on:
  push:
    branches:
      - fix/direct-third-party-includes

permissions:
  contents: write

jobs:
  fix-includes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-third-party-includes
          fetch-depth: 0

      - name: Correct include paths and remove root shims
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('DocBot.ahk')
          data = path.read_bytes()
          old = b'#Include JXON.ahk\n#Include ColorButton.ahk\n'
          new = b'#Include ThirdParty\\JXON\\JXON.ahk\n#Include ThirdParty\\ColorButton\\ColorButton.ahk\n'
          if old not in data:
              raise SystemExit('Verwachte root-includes niet gevonden')
          if data.count(old) != 1:
              raise SystemExit('Root-includeblok komt niet exact eenmaal voor')
          path.write_bytes(data.replace(old, new, 1))
          PY

          rm -f JXON.ahk ColorButton.ahk
          rm -f .github/workflows/fix-direct-third-party-includes.yml

          git diff --check
          grep -F '#Include ThirdParty\JXON\JXON.ahk' DocBot.ahk
          grep -F '#Include ThirdParty\ColorButton\ColorButton.ahk' DocBot.ahk
          test ! -e JXON.ahk
          test ! -e ColorButton.ahk

      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gebruik directe third-party include-paden'
          git push origin HEAD:fix/direct-third-party-includes
